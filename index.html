DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS MR - Mark XIII HUD OS</title>
  <style>
    :root {
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.6);
      --secondary: #ffb700;
      --panel-bg: rgba(6, 18, 36, 0.9);
      --panel-border: rgba(0, 240, 255, 0.5);
      --font-mono: 'Consolas', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: #000;
      color: var(--primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    #launch-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100;
      background: radial-gradient(circle at center, #05101f 0%, #010408 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .launcher-card {
      background: var(--panel-bg);
      border: 1px solid var(--primary);
      padding: 35px 45px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 50px var(--primary-glow);
      backdrop-filter: blur(20px);
      max-width: 460px;
    }

    h1 {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      letter-spacing: 3px;
